# event.yaml for the Annual Swiss RSE Day 2026
# Generated from https://rse.swiss/swiss_rse_day/ and
# https://rse.swiss/swiss_rse_day/schedule/
#
# NOTE: the source schedule gives no end time for the closing Apéro
# (17:00 onward) — duration_min for that entry is a 60-minute
# placeholder, adjust as needed.

event:
  name: "Annual Swiss RSE Day 2026"
  place: "CAB Building, ETH Zurich Centrum, Zurich, Switzerland"
  start: 2026-08-31
  end:   2026-08-31
  timezone: "Europe/Zurich"
  info: |
    A full-day event bringing together Research Software Engineers
    from academia, research, and industry, exploring RSE in Open
    Research Data and Open Science, artificial intelligence within
    Research Software Engineering, and community building among RSE
    professionals.

    Registration is free and closes 2026-08-17.

    Contact: rse-contact@sympa.ethz.ch

