      - id: craft-everse-project
        title: "EVERSE Project: Tools and Resources for Research Software Quality"
        start: 2026-08-31T11:15:00+02:00
        duration_min: 30
        speakers: [kenneth-rioja]
        room: g59
        description: |-
          **Presenter**: Kenneth Rioja from CERN

          ## Abstract

          EVERSE (https://everse.software/) is a community-led, EU-funded project
          bringing together 18 European institutions to establish a framework for
          research software quality and code excellence. Collaboratively designed by
          research communities, EVERSE aims to drive a cultural shift where research
          software is recognised as a first-class citizen of the scientific process and
          its contributors are duly credited. We will present the tools and resources
          EVERSE has developed over the last two years – ranging from practical guides
          and CLI tools to full platforms – tailored for researchers, RSEs, and those
          involved in research infrastructure or policy. We warmly welcome constructive
          feedback and early adopters.

          ## Intended audience

          RSEs, researchers, all levels are welcomed

          ## Main contributions

          A list of tools and resources to be shown and ready-to-be-used to the audience.

          ## Learning objectives

          * What is a Research Software
          * What is EVERSE and its contributions
          * How to enhance my research software code quality through a guide I follow, or CLI/GitHub Actions
          * How I can get credited for the software work I did

      - id: craft-sustainable-scientific-software
        title: "Building Sustainable Scientific Software: Lessons from Industry–Academia"
        start: 2026-08-31T11:45:00+02:00
        duration_min: 30
        speakers: [arnaud-mercier]
        room: g59
        description: |-
          **Presenter**: Arnaud Mercier from PhD in Mathematical Geophysics in D-EAPS at ETH Zurich


          Scientific software often faces a difficult balance between rapid research
          development and long-term maintainability. As new methods are introduced,
          ensuring reproducibility and reliability becomes increasingly challenging.

          In a collaboration between the Mathematical Geophysics Group at ETH Zurich and
          Mondaic AG, we developed an open-source Python framework for full-waveform
          inversion that combines research flexibility with modern software engineering
          practices. Beyond the software architecture itself, a key focus of the project
          has been the development of testing strategies adapted to scientific
          applications.

          While unit tests are widely adopted, they often fail to capture the complexity
          of real scientific workflows. We therefore complement them with integration
          tests that validate complete inversion pipelines on representative benchmark
          problems. These tests help ensure that new features, algorithmic changes, and
          performance improvements do not inadvertently alter scientific results.

          This contribution discusses the challenges of maintaining a research codebase
          used for both methodological development and production-scale computations,
          highlighting lessons learned in modularity, testing, reproducibility, and
          collaboration between academia and industry. I would like to keep the
          discussion accessible and focused on general software engineering principles,
          development practices, and the lessons I learned through collaboration with a
          start-up.

          Audience:<br/> Research software engineers, scientific programmers, and researchers developing computational tools.

          What participants will learn:<br/ Practical approaches to improving the reliability
          and sustainability of scientific software, with a particular focus on testing
          strategies that go beyond traditional unit tests.

