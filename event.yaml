      - id: rse-career-pathways-uk
        title: "Developing career pathways for RSEs and dRTPs: A UK perspective"
        start: 2026-08-31T14:45:00+02:00
        duration_min: 30
        speakers: [jeremy-cohen]
        room: g51
        description: |-
          **Presenter**: Jeremy Cohen from Imperial College London

          The term Research Software Engineering (RSE) was first used in the UK over a
          decade ago and it is now a recognised role within the field of research in many
          countries. As research across almost all domains is now increasingly digital,
          researchers need support not only with building sustainable, maintainable and
          robust research software, but also with managing and processing research data
          and the use of specialist research computing infrastructure. Within the UK,
          this has led to the emergence of a new term, 'digital Research Technical
          Professionals' (dRTPs) which is being used to represent the wider set of roles
          that are vital to supporting modern digital research.

          While the UK now has RSE groups or teams at a number of universities and the
          RSE role is widely recognised, RSE roles differ and can span a wide range of
          skills and competencies. At one end of the scale, RSE roles can look quite
          similar to traditional research roles, at the other, they can look similar to
          professional software engineer roles in an industry environment. How we provide
          effective support and career progression for people working across this
          spectrum, and in other dRTP roles, is not yet a solved problem.

          In this talk, I'll present some work being done in the UKRI-EPSRC-funded
          STEP-UP project to develop support for RSEs and dRTPs within the London and
          South East of England region of the UK, through a range of activities. I'll
          highlight our work advocating for improved career opportunities and pathways
          and our programmes to try and build concrete pathways into dRTP roles including
          a placement scheme and our Research Technical Champions programme. There is
          much that RSE communities across different countries can learn from each other.
          It is hoped that this talk and the associated discussion will provide an
          opportunity to share experiences and ideas around developing RSE career
          pathways and to understand where the Swiss and UK communities share similar
          challenges and what approaches and activities have been tried to address them.

          This talk is intended to be applicable to a general RSE and research audience.
          Attendees will learn about some approaches being taken in the UK to support and
          develop career opportunities for RSEs but also have the chance to provide their
          own perspectives on the topic of RSE careers through an interactive element of
          the presentation and the subsequent discussion.

      - id: rse-code-is-cheap
        title: "Code Is Cheap Now — Understanding Users Isn't"
        start: 2026-08-31T15:45:00+02:00
        duration_min: 30
        speakers: [ali-khosravi]
        room: g51
        description: |-
          **Presenter**: Ali Khosravi from PSI

          Main points of your contribution:

          1) The hard part of RSE isn't the code, it's understanding users and how they already work.
          2) A real case study: a data-sharing platform for a 30+ group, and projected ~200-researcher Swiss consortium.
          3) A concrete ''understand → build → ask → repeat'' loop, including real questionnaire findings.
          4) A reflection on how AI shifts the value of the job: when prototypes take days, user understanding, communication, and ownership become the scarce skills.

          What listeners will learn:

          1) A practical method for designing tools researchers will actually adopt (not just tools that work).
          2) Why existing habits make or break adoption, and how to account for them.
          3) How to run the build–feedback loop in practice, with lessons from a live project.
          4) How to rethink their own role, as AI makes code cheap.

          Intended audience & skills needed:

          Basically anyone who's interested in building tools for researchers, there will also be some values for research group leaders to see the experience. No specialist background needed: no specific programming language, domain, or FAIR-data expertise required.

      - id: rse-resin-network
        title: "RésIn: local network of RSEs in Paris"
        start: 2026-08-31T16:15:00+02:00
        duration_min: 30
        speakers: [diego-antolinos]
        room: g51
        description: |-
          **Presenter**: Diego Antolinos from Université de Neuchâtel

          A general presentation of the project RésIn (https://projet-resin.fr/projet)
          and its goal (creating a RSE network between Sciences Po Paris and Université
          Paris-Cité). Followed by a focus on its 3 key tools: the bimonthly method
          seminar (canonical seminar on research methods), the monthly open workshop (a
          special open-doors workshop where people can get help from engineers), and the
          online repository of engineers' profiles where people can sign up and display
          their key competences.

          I intend the presentation as an inspiration for RSE Swiss from a sister-project
          that's been successful-ish. And I think it can spark debate around the
          (in-)adaptation of some of its tools to our audience in Switzerland (e.g. the
          online repository is controversial).

  - id: software-craft
