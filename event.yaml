      - id: craft-ro-crate-schema-plus
        title: "RO-Crate Schema Plus: Self-Describing, Ontologized RO-Crate"
        start: 2026-08-31T14:45:00+02:00
        duration_min: 30
        speakers: [andreas-meier]
        room: g59
        description: |-
          **Presenter**: Andreas Meier from ETH Zurich

          Main points:<br/>
          Projects focused on interoperability in the ETH domain. RO-Crate Schema Plus profile is used as a common interchange format between heterogeneous systems, ELNs, repositories, with different schemas. RO-Crate Schema Plus adds a machine-readable schema with semantics to RO-Crate.

          What listeners will learn:<br/
          An approach to have a machine-readable RO-Crate profile with custom types.

          Intended audience:<br/
          People working with exchange formats, particularly RO-Crate

      - id: craft-short-and-terrible
        title: "Why make it long and understandable when you can make it short and terrible?"
        start: 2026-08-31T15:45:00+02:00
        duration_min: 30
        speakers: [samuel-gaist]
        room: g59
        description: |-
          **Presenter**: Samuel Gaist from Idiap Research Institute

          Everybody knows that writing lots of code is bad for the shoulders, elbows and
          carpal tunnel, however compacting code too much will hurt the brain in the long
          term.

          This talk will discuss coding best practices around the sweet spot of writing
          enough code to keep things clear and understandable without going overboard
          trying to be the LOC king. A science that stays true even in the age of agent
          coding and AI helpers.

      - id: craft-case-for-rse
        title: "The case for research software engineers"
        start: 2026-08-31T16:15:00+02:00
        duration_min: 30
        speakers: [erik-frojdh]
        room: g59
        description: |-
          **Presenter**: Erik Fröjdh from Paul Scherrer Institut

          The detector group at PSI develops high-performance X-ray detectors for
          synchrotrons and free-electron lasers. Traditionally, software for detector
          characterisation and data analysis was developed by PhD students and postdocs
          for specific use cases, with little code sharing. However, with data rates from
          the next generation of detectors reaching several 100 Gbit/s, and a typical
          dataset from an experiment being on the order of 10 TB, this is no longer
          feasible.

          In this talk, we show a path from a world of 'it works on my machine,' with
          custom scripts and makefiles containing hardcoded paths, to fast and reliable
          software. We are also improving efficiency by reducing duplicated work. As an
          example, we take a closer look at the calibration code for the Jungfrau
          detector, where, using relatively standard techniques, we were able to reduce
          the runtime from around 2.5 hours to 3 minutes showing the value that a
          Research Software Engineer can bring.

  - id: platforms-applications
    name: "Platforms & Applications"
    talks:
      - id: platforms-cryogenic-samples
        title: "Storing cryogenic samples in ultra-high vacuum"
        start: 2026-08-31T11:15:00+02:00
        duration_min: 30
        speakers: [reto-trappitsch]
        room: g56
        description: |-
          **Presenter**: Reto Trappitsch from EPFL

          To store frozen research samples after sample preparation and prior to analysis,
          a storage chamber that keeps them at 120 K temperature and in ultra-high vacuum
          (~1e-9 mbar) is required. In this talk I will discuss the development and
          integration of the control electronics, firmware, and host software with
          user-interface that now controls our home-built cryostorage solution. I will
          specifically point out how and why Rust is the ideal language for this
          development and how it can be used across the hardware stack.

          Controlling the chamber requires

          - (a) control of certain parts via digital I/O
          lines,
          - (b) communication with several existing instruments via established protocols (e.g., via RS-232),
          - (c) reading, updating, and displaying the current status of the chamber and attached instruments,
          - and (d) interfacing with the user.

          The electronics board for task (a) was designed in-house and uses a
          Raspberry Pi Pico 2 board as the controlling MCU. Firmware for this MCU was
          written in Rust using `embassy`. This firmware communicates with our Rust-based
          host software (which takes care of tasks (c) and (d)) using `postcard` and
          `postcard-rpc`. Finally, we also developed Rust crates to communicate with
          various instruments via RS-232, RS-485, and OPC UA. The host software and
          touch-driven user interface runs on a Seeed Studio reTerminal DM, a Raspberry Pi
          Compute Module 4 based Linux computer with a 10'' touch screen. The user
          interface was developed using Slint.

      - id: platforms-renku
        title: "Empowering sustainable research projects with Renku"
        start: 2026-08-31T11:45:00+02:00
        duration_min: 30
        speakers: [elisabet-capon-garcia]
        room: g56
        description: |-
          **Presenter**: Elisabet Capon Garcia from Swiss Data Science Center

          In this talk, we present  Renku which stands for a trustworthy platform that
          enables collaboration and ensures reusability and repeatability of
          computational-based research projects.
          The objective is to raise awareness of
          the importance of project sustainability and lowering the entry barrier for
          reproducibility of AI and DS project by ensuring a smooth integration of data,
          code and compute infrastructure.

          Listeners will get familiarised with the Renku
          platform, where they can create and share projects, and seamlessly connect them
          to their data sources and code repositories through a unified and user-friendly
          interface. Renku users do not need to handle the complexity to set-up the
          connections with their cloud providers because Renku handles this behind the
          scenes. Even more, the listeners will learn to set up different environments
          for their projects, from Python or R based development environments to Shiny or
          streamlit apps to showcase their results.

          On the compute side, Renku offers a
          free tier with available compute resources to run  sessions. If users require
          more compute resources than the free tier, they can either connect to their
          preferred cloud provider through Renku, connect to HPC clusters or contact us
          to provision further resources for them and their team.

